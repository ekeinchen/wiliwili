name: Build wiliwili (Windows 64-bit with all DLLs)

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: '发布新版本'
        required: false
        default: 'false'
      version:
        description: '版本号'
        required: false
        default: '0.0.0'
      disable_unity_build:
        description: '禁用联合构建'
        required: false
        default: 'false'

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.info.outputs.version }}
      DIST_EXE: ${{ steps.info.outputs.DIST_EXE }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 调试版本
        run: |
          export VERSION=$(git rev-parse --short HEAD)
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: 发布版本
        if: github.event.inputs.release == 'true' && github.event.inputs.release != 'false' && !cancelled()
        run: |
          export VERSION="${{ github.event.inputs.version }}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: 版本信息
        id: info
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "DIST_EXE=wiliwili-Windows-${VERSION}" >> $GITHUB_OUTPUT

  build-win:
    needs: [ version ]
    runs-on: windows-2022
    strategy:
      matrix:
        include:
          - { arch: x86_64, msystem: MINGW64, driver: d3d, cmake: "-DUSE_D3D11=ON" }
    env:
      MSYSTEM: ${{ matrix.msystem }}
      MSYS2_PATH_TYPE: inherit
      CHERE_INVOKING: 1
    defaults:
      run:
        shell: cmd /c "call C:\msys64\msys2_shell.cmd -mingw64 -no-start -here -c \"{0}\"" 
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      
      - name: 初始化MSYS2
        run: |
          set MSYS=winsymlinks:nativestrict
          pacman --noconfirm -Syuu --overwrite '*' --ignore=pacman,msys2-runtime
          pacman --noconfirm -Syu
      
      - name: 安装构建工具链
        run: |
          pacman --noconfirm -S --needed \
            mingw-w64-x86_64-toolchain \
            mingw-w64-x86_64-cmake \
            mingw-w64-x86_64-ninja \
            mingw-w64-x86_64-curl \
            mingw-w64-x86_64-openssl \
            mingw-w64-x86_64-ca-certificates \
            unzip
      
      - name: 安装mpv和cv2pdb
        run: |
          curl -L -o mpv.pkg.tar.zst https://github.com/xfangfang/wiliwili/releases/download/v0.1.0/mingw-w64-x86_64-mpv-0.39.0-4-any.pkg.tar.zst
          pacman --noconfirm -U mpv.pkg.tar.zst
          
          curl -L -o cv2pdb.zip https://github.com/rainers/cv2pdb/releases/download/v0.52/cv2pdb-0.52.zip
          unzip -j cv2pdb.zip cv2pdb64.exe -d /mingw64/bin
      
      - name: 构建准备
        run: |
          sed -i 's/cmake_minimum_required(VERSION 2.8)/cmake_minimum_required(VERSION 3.5)/' library/borealis/library/lib/extern/tweeny/CMakeLists.txt
          
          BRLS_GLFW=library/borealis/library/lib/extern/glfw
          cmake -P ${BRLS_GLFW}/CMake/GenerateMappings.cmake ${BRLS_GLFW}/src/mappings.h.in ${BRLS_GLFW}/src/mappings.h
      
      - name: 配置和构建
        env:
          SSL_CERT_FILE: /mingw64/ssl/certs/ca-bundle.crt
        run: |
          mkdir build && cd build
          cmake .. -G Ninja ${{ matrix.cmake }} \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_INSTALL_PREFIX=/mingw64 \
            -DPLATFORM_DESKTOP=ON \
            -DWIN32_TERMINAL=OFF \
            -DUSE_SYSTEM_CURL=ON \
            -DCPR_FORCE_WINSSL_BACKEND=ON \
            -DUSE_LIBROMFS=ON \
            -DBRLS_UNITY_BUILD=${{ github.event.inputs.disable_unity_build == 'true' && 'OFF' || 'ON' }} \
            -DMPV_BUNDLE_DLL=/mingw64/bin/libmpv-2.dll \
            -DVERSION_BUILD=${{ github.run_number }}
          
          cmake --build . --config RelWithDebInfo
          cv2pdb64 wiliwili.exe
          cp wiliwili.exe wiliwili.pdb ..
      
      - name: 打包发布文件
        run: |
          mkdir -p dist
          cp build/wiliwili.exe build/wiliwili.pdb dist/
          cp README.md dist/
          
          mkdir -p dist/ssl/certs
          cp /mingw64/ssl/certs/ca-bundle.crt dist/ssl/certs/
          
          for binary in dist/wiliwili.exe; do
            ntldd -R $binary | grep -i mingw64 | awk '{print $3}' | xargs -I{} cp {} dist/
          done
          
          REQUIRED_DLLS=(
            libwinpthread-1.dll
            libgcc_s_seh-1.dll
            libstdc++-6.dll
            libmpv-2.dll
            libssl-3-x64.dll
            libcrypto-3-x64.dll
          )
          
          for dll in "${REQUIRED_DLLS[@]}"; do
            if [ ! -f "dist/${dll}" ]; then
              cp "/mingw64/bin/${dll}" dist/
            fi
          done
      
      - name: 上传制品
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.version.outputs.DIST_EXE }}-${{ matrix.driver }}-${{ matrix.arch }}-full
          path: dist/*

  release:
    needs: [ build-win, version ]
    if: github.event.inputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      
      - name: 创建发布包
        run: |
          zip -r -9 ${{ needs.version.outputs.DIST_EXE }}-x86_64-full.zip ${{ needs.version.outputs.DIST_EXE }}-d3d-x86_64-full/*

      - name: 发布版本
        uses: ncipollo/release-action@v1
        with:
          name: wiliwili ${{ github.event.inputs.version }}
          tag: ${{ github.event.inputs.version }}
          body: Windows 64位构建版 wiliwili (包含所有必需DLL)
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: ${{ needs.version.outputs.DIST_EXE }}-x86_64-full.zip
