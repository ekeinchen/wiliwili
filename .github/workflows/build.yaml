name: Build

on:
  workflow_dispatch:
    inputs:
      disable_unity_build:
        description: 'Disable unity build'
        required: false
        default: 'false'

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      VERSION: ${{ steps.version.outputs.VERSION }}
      DIST_EXE: ${{ steps.version.outputs.DIST_EXE }}
      DIST_NRO: ${{ steps.version.outputs.DIST_NRO }}
      DIST_INTEL_DMG: ${{ steps.version.outputs.DIST_INTEL_DMG }}
      DIST_ARM_DMG: ${{ steps.version.outputs.DIST_ARM_DMG }}
      DIST_UNIVERSAL_DMG: ${{ steps.version.outputs.DIST_UNIVERSAL_DMG }}
      DIST_FLATPAK_X86_64: ${{ steps.version.outputs.DIST_FLATPAK_X86_64 }}
      DIST_UWP: ${{ steps.version.outputs.DIST_UWP }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Get version
        id: version
        run: |
          # 这里需要根据实际情况获取版本号
          VERSION=$(git describe --tags --always)
          DIST_EXE="wiliwili"
          DIST_NRO="wiliwili-nro"
          DIST_INTEL_DMG="wiliwili-intel"
          DIST_ARM_DMG="wiliwili-arm"
          DIST_UNIVERSAL_DMG="wiliwili-universal"
          DIST_FLATPAK_X86_64="wiliwili-flatpak-x86_64"
          DIST_UWP="wiliwili-uwp"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "DIST_EXE=$DIST_EXE" >> $GITHUB_OUTPUT
          echo "DIST_NRO=$DIST_NRO" >> $GITHUB_OUTPUT
          echo "DIST_INTEL_DMG=$DIST_INTEL_DMG" >> $GITHUB_OUTPUT
          echo "DIST_ARM_DMG=$DIST_ARM_DMG" >> $GITHUB_OUTPUT
          echo "DIST_UNIVERSAL_DMG=$DIST_UNIVERSAL_DMG" >> $GITHUB_OUTPUT
          echo "DIST_FLATPAK_X86_64=$DIST_FLATPAK_X86_64" >> $GITHUB_OUTPUT
          echo "DIST_UWP=$DIST_UWP" >> $GITHUB_OUTPUT

  build-win:
    needs: [ version ]
    runs-on: windows-2019
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, msystem: MINGW64, driver: gl }
          - { arch: x86_64, msystem: MINGW64, driver: d3d, cmake: "-DUSE_D3D11=ON" }
          - { arch: x86, msystem: MINGW32, driver: gl, cmake: "-DUSE_GL2=ON" }
          - { arch: x86, msystem: MINGW32, driver: d3d, cmake: "-DUSE_D3D11=ON" }
        arch: [ x86_64, x86 ]
        driver: [gl, d3d]
    env:
      MSYSTEM: ${{ matrix.msystem }}
      MSYS2_PATH_TYPE: inherit
    defaults:
      run:
        shell: C:\shells\msys2bash.cmd {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Install dependency
        run: |
          pacman -S --needed --noconfirm --noprogressbar \
            ${MINGW_PACKAGE_PREFIX}-gcc \
            ${MINGW_PACKAGE_PREFIX}-ninja unzip

          curl -LO https://github.com/xfangfang/wiliwili/releases/download/v0.1.0/${MINGW_PACKAGE_PREFIX}-mpv-0.39.0-4-any.pkg.tar.zst
          pacman -U --noconfirm *.pkg.tar.zst

          curl -LO https://github.com/rainers/cv2pdb/releases/download/v0.52/cv2pdb-0.52.zip
          unzip cv2pdb-0.52.zip cv2pdb64.exe -d /usr/bin
      - if: matrix.arch == 'x86'
        name: Config Editbin
        shell: powershell
        run: |
          $vcvarsall_path = vswhere.exe -latest -products * -find "VC\Auxiliary\Build\vcvarsall.bat"
          $cc1_path = Get-ChildItem -Path "C:\msys64\mingw32\lib\gcc" -Filter cc1plus.exe -Recurse -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
          cmd.exe /c "call ""$vcvarsall_path"" x86_amd64 && editbin /LARGEADDRESSAWARE $cc1_path"
      - name: Update gamepad db
        run: |
          BRLS_GLFW=library/borealis/library/lib/extern/glfw
          cmake -P ${BRLS_GLFW}/CMake/GenerateMappings.cmake ${BRLS_GLFW}/src/mappings.h.in ${BRLS_GLFW}/src/mappings.h
      - name: Build
        run: |
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DPLATFORM_DESKTOP=ON \
            -DWIN32_TERMINAL=OFF \
            -DUSE_SYSTEM_CURL=ON \
            -DUSE_LIBROMFS=ON \
            -DBRLS_UNITY_BUILD=${{ github.event.inputs.disable_unity_build == 'true' && 'OFF' || 'ON' }} \
            -DCMAKE_UNITY_BUILD_BATCH_SIZE=20 \
            -DZLIB_USE_STATIC_LIBS=ON \
            -DMPV_BUNDLE_DLL=${MINGW_PREFIX}/bin/libmpv-2.dll \
            -DVERSION_BUILD=${{ github.run_number }} \
            ${{ matrix.cmake }}
          cmake --build .
          cv2pdb64 wiliwili.exe
          cp -a ../README.md .
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.version.outputs.DIST_EXE }}-${{ matrix.driver }}-${{ matrix.arch }}
          path: |
            build/wiliwili.exe
            build/wiliwili.pdb
            build/README.md
