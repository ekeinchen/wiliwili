name: wiliwili Windows Build (Fixed MSYS2)

on:
  workflow_dispatch:  # 保留手动触发
  push:
    branches: [ main, master ]
    paths:
      - '**.cpp'
      - '**.hpp'
      - '**.h'
      - 'CMakeLists.txt'

jobs:
  build-windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: cmd  # 关键修复：使用 Windows 原生 shell
    env:
      MSYSTEM: MINGW64
      MSYS2_PATH_TYPE: inherit
      CHOCOLATEY_NO_PROMPT: 1

    steps:
    - name: Setup MSYS2
      run: |
        # 安装 Chocolatey (Windows 包管理器)
        Set-ExecutionPolicy Bypass -Scope Process -Force
        [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
        iex ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
        
        # 通过 Chocolatey 安装 MSYS2
        choco install msys2 -y --params="/NoUpdate"
        refreshenv

    - name: Set up MSYS2 environment
      run: |
        # 初始化 MSYS2
        C:\tools\msys64\usr\bin\bash -lc "pacman -Syu --noconfirm"
        C:\tools\msys64\usr\bin\bash -lc "pacman -S --needed --noconfirm base-devel mingw-w64-x86_64-toolchain"

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        C:\tools\msys64\usr\bin\bash -lc "
          pacman -S --noconfirm --needed \
            mingw-w64-x86_64-cmake \
            mingw-w64-x86_64-ninja \
            mingw-w64-x86_64-curl \
            mingw-w64-x86_64-openssl \
            mingw-w64-x86_64-ffmpeg
        "

    - name: Configure build
      run: |
        C:\tools\msys64\usr\bin\bash -lc "
          mkdir -p build && cd build
          cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_MAKE_PROGRAM=ninja \
            ..
        "

    - name: Build project
      run: |
        C:\tools\msys64\usr\bin\bash -lc "
          cd build
          ninja
        "

    - name: Collect binaries
      run: |
        mkdir package
        copy build\wiliwili.exe package
        copy C:\tools\msys64\mingw64\bin\*.dll package

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: wiliwili-windows-build
        path: package/*
