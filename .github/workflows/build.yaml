name: Build wiliwili (Windows 64-bit with TLS Fix)

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Create release'
        required: false
        default: 'false'
      version:
        description: 'Version tag'
        required: false
        default: '0.0.0'

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.info.outputs.version }}
      dist_name: ${{ steps.info.outputs.dist_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set version
        id: info
        run: |
          if [[ "${{ github.event.inputs.release }}" == "true" ]]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          fi
          echo "dist_name=wiliwili-${{ github.event.inputs.version || 'nightly' }}-win64" >> $GITHUB_OUTPUT

  build:
    needs: version
    runs-on: windows-2022
    env:
      MSYSTEM: MINGW64
      MSYS2_PATH_TYPE: inherit
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSYS2
        shell: msys2 {0}
        run: |
          pacman -Syuu --noconfirm --needed \
            mingw-w64-x86_64-toolchain \
            mingw-w64-x86_64-cmake \
            mingw-w64-x86_64-ninja \
            mingw-w64-x86_64-curl \
            mingw-w64-x86_64-openssl \
            mingw-w64-x86_64-ntldd-git

      - name: Install MPV
        shell: msys2 {0}
        run: |
          curl -LO https://github.com/xfangfang/wiliwili/releases/download/v0.1.0/mingw-w64-x86_64-mpv-0.39.0-4-any.pkg.tar.zst
          pacman -U --noconfirm *.pkg.tar.zst

      - name: Update SSL Certs
        shell: msys2 {0}
        run: |
          mkdir -p /ssl/certs
          curl -ksSL https://curl.se/ca/cacert.pem -o /ssl/certs/cacert.pem
          echo "SSL_CERT_FILE=/ssl/certs/cacert.pem" >> $GITHUB_ENV

      - name: Configure Build
        shell: msys2 {0}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPENSSL_ROOT_DIR=${MINGW_PREFIX} \
            -DCURL_USE_OPENSSL=ON \
            -DCPR_FORCE_OPENSSL_BACKEND=ON \
            -DCMAKE_INSTALL_PREFIX=./dist

      - name: Build
        shell: msys2 {0}
        run: |
          cmake --build build --target install

      - name: Collect DLLs
        shell: bash
        run: |
          mkdir -p dist/ssl/certs
          cp /ssl/certs/cacert.pem dist/ssl/certs/
          
          # 收集所有运行时依赖
          ntldd -R dist/bin/wiliwili.exe | grep -i mingw64 | awk '{print $3}' | while read -r dll; do
            cp "$(cygpath -u "$dll")" dist/bin/
          done

      - name: Package
        run: |
          cd dist
          7z a ../${{ needs.version.outputs.dist_name }}.zip *

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.version.outputs.dist_name }}
          path: ${{ needs.version.outputs.dist_name }}.zip

  release:
    needs: [build, version]
    if: ${{ github.event.inputs.release == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.event.inputs.version }}
          artifacts: ${{ needs.version.outputs.dist_name }}.zip
          token: ${{ secrets.GITHUB_TOKEN }}
