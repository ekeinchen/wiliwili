release:
  needs: [ build-win, version ]
  if: github.event.inputs.release == 'true'
  runs-on: ubuntu-latest
  steps:
    - uses: actions/download-artifact@v4
      with:
        name: ${{ needs.version.outputs.DIST_EXE }}-${{ matrix.driver }}-${{ matrix.arch }}-full

    - name: Create ZIP package
      run: |
        # 确保目录存在
        ARTIFACT_DIR="${{ needs.version.outputs.DIST_EXE }}-d3d-x86_64-full"
        if [ ! -d "$ARTIFACT_DIR" ]; then
          echo "::error::Directory $ARTIFACT_DIR not found!"
          exit 1
        fi

        # 压缩所有文件
        cd "$ARTIFACT_DIR"
        zip -r ../${{ needs.version.outputs.DIST_EXE }}-x86_64-full.zip *
        cd ..

        # 验证ZIP是否生成
        if [ ! -f "${{ needs.version.outputs.DIST_EXE }}-x86_64-full.zip" ]; then
          echo "::error::Failed to create ZIP file!"
          exit 1
        fi

    - name: Create Release
      uses: ncipollo/release-action@v1
      with:
        name: wiliwili ${{ github.event.inputs.version }}
        tag: ${{ github.event.inputs.version }}
        artifacts: ${{ needs.version.outputs.DIST_EXE }}-x86_64-full.zip
