name: wiliwili Windows Build (Stable)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      release:
        description: 'Create release package'
        required: false
        default: 'true'

jobs:
  build:
    runs-on: windows-2022
    env:
      MSYSTEM: MINGW64
      MSYS2_PATH_TYPE: inherit
      BUILD_DIR: ${{ github.workspace }}/build
      SOURCE_DIR: ${{ github.workspace }}/src

    steps:
      # 步骤1：检出代码到指定目录
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          path: 'src'  # 关键修复：明确指定检出目录

      # 步骤2：设置MSYS2环境
      - name: Setup MSYS2
        shell: powershell
        run: |
          # 安装MSYS2
          if (-not (Test-Path "C:\tools\msys64")) {
            choco install msys2 -y --params="/NoUpdate"
            refreshenv
          }
          
          # 更新基础包
          C:\tools\msys64\usr\bin\bash -lc "pacman -Syu --noconfirm --needed"
          
          # 安装编译工具链
          C:\tools\msys64\usr\bin\bash -lc "
            pacman -S --needed --noconfirm \
              mingw-w64-x86_64-toolchain \
              mingw-w64-x86_64-cmake \
              mingw-w64-x86_64-ninja
          "

      # 步骤3：安装依赖库
      - name: Install dependencies
        shell: powershell
        run: |
          C:\tools\msys64\usr\bin\bash -lc "
            pacman -S --needed --noconfirm \
              mingw-w64-x86_64-curl \
              mingw-w64-x86_64-openssl \
              mingw-w64-x86_64-ffmpeg \
              mingw-w64-x86_64-mpv
          "

      # 步骤4：验证目录结构
      - name: Verify source tree
        shell: bash
        run: |
          echo "Workspace: $GITHUB_WORKSPACE"
          ls -l "$GITHUB_WORKSPACE/src"
          if [ ! -f "$GITHUB_WORKSPACE/src/CMakeLists.txt" ]; then
            echo "::error::CMakeLists.txt not found!"
            exit 1
          fi

      # 步骤5：构建项目（修复路径问题）
      - name: Build project
        shell: powershell
        run: |
          $buildArgs = @(
            "-G Ninja",
            "-DCMAKE_BUILD_TYPE=Release",
            "-DOPENSSL_ROOT_DIR=C:/tools/msys64/mingw64",
            "-DCURL_USE_OPENSSL=ON",
            "-S $env:SOURCE_DIR",
            "-B $env:BUILD_DIR"
          )
          
          C:\tools\msys64\usr\bin\bash -lc "
            echo '=== Starting build ==='
            cmake $($buildArgs -join ' ')
            cmake --build $env:BUILD_DIR
          "

      # 步骤6：打包成果物
      - name: Package artifacts
        shell: powershell
        run: |
          $zipName = "wiliwili-$env:GITHUB_SHA.substring(0,7)-win64.zip"
          $artifactDir = "$env:BUILD_DIR/package"
          
          New-Item -ItemType Directory -Path $artifactDir -Force
          Copy-Item "$env:BUILD_DIR/wiliwili.exe" $artifactDir
          
          # 复制所有依赖DLL
          Get-ChildItem "C:\tools\msys64\mingw64\bin\*.dll" | 
            Where-Object { $_.Name -match 'lib(gcc|stdc\+\+|winpthread|curl|ssl|crypto|mpv|ffmpeg)' } |
            Copy-Item -Destination $artifactDir
          
          Compress-Archive -Path "$artifactDir\*" -DestinationPath $zipName
          Write-Output "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      # 步骤7：上传成果物
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}
          retention-days: 3
