name: Windows 64-bit Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

env:
  BUILD_DIR: _build
  MSYS2_PATH: C:/msys64

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 15

    steps:
      # 1. Checkout code
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2. Setup MSYS2 (safe mode)
      - name: Configure MSYS2
        shell: cmd
        run: |
          reg add "HKLM\SOFTWARE\MSYS2" /v "DisableAutoUpdate" /t REG_DWORD /d 1 /f
          echo "MSYS2 configured"

      # 3. Install dependencies
      - name: Install tools
        shell: bash
        run: |
          echo "Using MSYS2 at ${{ env.MSYS2_PATH }}"
          pacman -Syu --noconfirm --needed --noprogressbar \
            mingw-w64-x86_64-gcc \
            mingw-w64-x86_64-ninja \
            mingw-w64-x86_64-curl \
            mingw-w64-x86_64-mpv

      # 4. Configure build
      - name: Run CMake
        shell: bash
        run: |
          cmake -B ${{ env.BUILD_DIR }} -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_SYSTEM_CURL=ON

      # 5. Build project
      - name: Compile
        shell: bash
        run: |
          cmake --build ${{ env.BUILD_DIR }} --parallel $(nproc)

      # 6. Prepare artifacts
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp ${{ env.BUILD_DIR }}/wiliwili.exe dist/
          cp ${{ env.MSYS2_PATH }}/mingw64/bin/libcurl-4.dll dist/
          cp ${{ env.MSYS2_PATH }}/mingw64/bin/libmpv-2.dll dist/
          zip -j wiliwili-win64.zip dist/*

      # 7. Upload artifacts
      - uses: actions/upload-artifact@v3
        with:
          name: wiliwili-win64
          path: wiliwili-win64.zip
