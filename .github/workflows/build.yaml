name: 构建 wiliwili (Windows 64位)

jobs:
  build-win:
    runs-on: windows-2022
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 设置MSYS2环境
        shell: cmd
        run: |
          choco install msys2 -y --params="/NoUpdate"
          set PATH=C:\msys64\usr\bin;%PATH%
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm \
            mingw-w64-x86_64-toolchain \
            mingw-w64-x86_64-cmake \
            mingw-w64-x86_64-ninja

      - name: 构建项目
        shell: cmd
        run: |
          mkdir build
          cd build
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build .

      - name: 准备发布文件
        shell: cmd
        run: |
          mkdir dist
          copy build\wiliwili.exe dist\
          copy build\*.dll dist\ || echo "没有DLL文件需要复制"
          dir dist

      - name: 强制验证制品
        shell: cmd
        run: |
          if not exist "dist\wiliwili.exe" (
            echo "::error::可执行文件未生成!"
            exit 1
          )
          echo "验证通过，找到可执行文件"

      - name: 上传制品
        uses: actions/upload-artifact@v4
        with:
          name: wiliwili-build
          path: dist/*
          if-no-files-found: error
