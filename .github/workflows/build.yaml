name: wiliwili Windows Build

on:
  # 自动触发条件（修复版）
  push:
    branches: [ main, master, dev ]  # 监听所有常用默认分支
    paths:                          # 只有这些文件变化时才触发
      - '**.cpp'
      - '**.hpp'
      - '**.h'
      - 'CMakeLists.txt'
      - '!docs/**'                  # 忽略文档目录
  pull_request:
    branches: [ main, master ]      # PR 到这些分支时触发
  # 手动触发选项
  workflow_dispatch:
    inputs:
      skip-tests:
        description: 'Skip test cases'
        required: false
        default: 'false'

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set-version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set build version
        id: set-version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=manual-${{ github.run_id }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "version=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          fi

  build-windows:
    needs: setup
    runs-on: windows-2022
    env:
      MSYSTEM: MINGW64
      MSYS2_PATH_TYPE: inherit
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSYS2
        shell: msys2 {0}
        run: |
          # 更新基础系统
          pacman -Syuu --noconfirm --needed
          # 安装编译工具链
          pacman -S --noconfirm --needed \
            mingw-w64-x86_64-toolchain \
            mingw-w64-x86_64-cmake \
            mingw-w64-x86_64-ninja \
            mingw-w64-x86_64-curl \
            mingw-w64-x86_64-openssl

      - name: Install dependencies
        shell: msys2 {0}
        run: |
          # 安装多媒体组件
          pacman -S --noconfirm --needed \
            mingw-w64-x86_64-ffmpeg \
            mingw-w64-x86_64-mpv

      - name: Configure build
        shell: msys2 {0}
        run: |
          mkdir build && cd build
          cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPENSSL_ROOT_DIR=${MINGW_PREFIX} \
            -DCURL_USE_OPENSSL=ON \
            ..

      - name: Build project
        shell: msys2 {0}
        run: |
          cd build
          ninja

      - name: Collect binaries
        shell: bash
        run: |
          mkdir -p package
          cp build/wiliwili.exe package/
          cp ${MINGW_PREFIX}/bin/*.dll package/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wiliwili-${{ needs.setup.outputs.version }}-windows
          path: package/*

  deploy:
    needs: build-windows
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: wiliwili-${{ needs.setup.outputs.version }}-windows

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.setup.outputs.version }}
          files: |
            wiliwili-${{ needs.setup.outputs.version }}-windows/*
