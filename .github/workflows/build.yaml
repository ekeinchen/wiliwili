name: 构建 wiliwili (Windows 64位含所有DLL)

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: '发布新版本'
        required: false
        default: 'false'
      version:
        description: '版本号'
        required: false
        default: '0.0.0'
      disable_unity_build:
        description: '禁用Unity构建'
        required: false
        default: 'false'

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.info.outputs.version }}
      DIST_EXE: ${{ steps.info.outputs.DIST_EXE }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 调试版本
        run: |
          export VERSION=$(git rev-parse --short HEAD)
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: 发布版本
        if: github.event.inputs.release == 'true' && github.event.inputs.release != 'false' && !cancelled()
        run: |
          export VERSION="${{ github.event.inputs.version }}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: 版本信息
        id: info
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "DIST_EXE=wiliwili-Windows-${VERSION}" >> $GITHUB_OUTPUT

  build-win:
    needs: [ version ]
    runs-on: windows-2022
    strategy:
      matrix:
        include:
          - { arch: x86_64, msystem: MINGW64, driver: d3d, cmake: "-DUSE_D3D11=ON" }
    env:
      MSYSTEM: ${{ matrix.msystem }}
      MSYS2_PATH_TYPE: inherit
      SSL_CERT_FILE: ${{ github.workspace }}/cacert.pem
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: 初始化MSYS2
        run: |
          # 解决退出代码77的关键修复
          Remove-Item -Recurse -Force "C:\msys64\var\cache\pacman\pkg" -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path "C:\msys64\var\cache\pacman\pkg" -Force
          
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      
      - name: 设置MSYS2环境
        run: |
          pacman --noconfirm -Syu
          pacman --noconfirm -Syuu
          pacman --noconfirm -S --needed --noprogressbar \
            ${MINGW_PACKAGE_PREFIX}-gcc \
            ${MINGW_PACKAGE_PREFIX}-ninja \
            ${MINGW_PACKAGE_PREFIX}-cmake \
            ${MINGW_PACKAGE_PREFIX}-curl \
            ${MINGW_PACKAGE_PREFIX}-toolchain \
            ${MINGW_PACKAGE_PREFIX}-ntldd-git \
            ${MINGW_PACKAGE_PREFIX}-openssl \
            unzip \
            make \
            ${MINGW_PACKAGE_PREFIX}-pkg-config
      
      - name: 安装依赖项
        run: |
          # 安装mpv
          curl -L -o mpv.pkg.tar.zst https://github.com/xfangfang/wiliwili/releases/download/v0.1.0/${MINGW_PACKAGE_PREFIX}-mpv-0.39.0-4-any.pkg.tar.zst
          pacman -U --noconfirm mpv.pkg.tar.zst || true

          # 安装cv2pdb
          curl -L -o cv2pdb.zip https://github.com/rainers/cv2pdb/releases/download/v0.52/cv2pdb-0.52.zip
          unzip -oj cv2pdb.zip cv2pdb64.exe -d /usr/bin

          # 下载CA证书
          curl -L -o cacert.pem https://curl.se/ca/cacert.pem
      
      - name: 修补tweeny CMakeLists
        run: |
          sed -i 's/cmake_minimum_required(VERSION 2.8)/cmake_minimum_required(VERSION 3.5)/' library/borealis/library/lib/extern/tweeny/CMakeLists.txt
      
      - name: 更新游戏手柄数据库
        run: |
          BRLS_GLFW=library/borealis/library/lib/extern/glfw
          cmake -P ${BRLS_GLFW}/CMake/GenerateMappings.cmake ${BRLS_GLFW}/src/mappings.h.in ${BRLS_GLFW}/src/mappings.h
      
      - name: 构建项目
        run: |
          export CURL_INCLUDE_DIR=${MINGW_PREFIX}/include
          export CURL_LIBRARY=${MINGW_PREFIX}/lib/libcurl.a
          
          # 添加调试信息
          echo "=== 环境变量 ==="
          env | sort
          echo "=== 编译器版本 ==="
          gcc --version
          echo "=== CMake版本 ==="
          cmake --version
          
          cmake -B build -G Ninja ${{ matrix.cmake }} \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DPLATFORM_DESKTOP=ON \
            -DWIN32_TERMINAL=OFF \
            -DUSE_SYSTEM_CURL=ON \
            -DCPR_FORCE_OPENSSL_BACKEND=ON \
            -DCPR_USE_SYSTEM_CURL=ON \
            -DCURL_INCLUDE_DIR=${CURL_INCLUDE_DIR} \
            -DCURL_LIBRARY=${CURL_LIBRARY} \
            -DUSE_LIBROMFS=ON \
            -DBRLS_UNITY_BUILD=${{ github.event.inputs.disable_unity_build == 'true' && 'OFF' || 'ON' }} \
            -DCMAKE_UNITY_BUILD_BATCH_SIZE=20 \
            -DZLIB_USE_STATIC_LIBS=ON \
            -DMPV_BUNDLE_DLL=${MINGW_PREFIX}/bin/libmpv-2.dll \
            -DVERSION_BUILD=${{ github.run_number }} \
            -DCMAKE_POLICY_DEFAULT_CMP0048=NEW \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DOPENSSL_ROOT_DIR=${MINGW_PREFIX}
          
          cmake --build build --verbose
          cv2pdb64 build/wiliwili.exe
      
      - name: 收集所有DLL文件
        run: |
          mkdir -p dist
          cp build/wiliwili.exe dist/
          cp build/wiliwili.pdb dist/
          cp README.md dist/
          cp cacert.pem dist/

          # 使用ntldd自动收集依赖
          ntldd -R dist/wiliwili.exe | grep -i mingw | awk '{print $3}' | xargs -I{} cp {} dist/

          # 额外验证关键文件
          REQUIRED_FILES=(
            "libcurl-4.dll"
            "libssl-3-x64.dll"
            "libcrypto-3-x64.dll"
            "libmpv-2.dll"
          )

          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "dist/${file}" ]; then
              echo "::error::关键文件缺失: ${file}"
              exit 1
            fi
          done
      
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.version.outputs.DIST_EXE }}-${{ matrix.driver }}-${{ matrix.arch }}-full
          path: dist/*

  release:
    needs: [ build-win, version ]
    if: github.event.inputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      
      - name: 创建发布包
        run: |
          zip -r -9 ${{ needs.version.outputs.DIST_EXE }}-x86_64-full.zip ${{ needs.version.outputs.DIST_EXE }}-d3d-x86_64-full/*

      - name: 创建GitHub发布
        uses: ncipollo/release-action@v1
        with:
          name: wiliwili ${{ github.event.inputs.version }}
          tag: ${{ github.event.inputs.version }}
          omitBodyDuringUpdate: true
          body: Windows 64位构建的wiliwili(包含所有必需DLL)
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: ${{ needs.version.outputs.DIST_EXE }}-x86_64-full.zip
