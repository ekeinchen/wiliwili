name: Build wiliwili (Windows 64-bit with all DLLs)

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Push a new release'
        required: false
        default: 'false'
      version:
        description: 'Version'
        required: false
        default: '0.0.0'
      disable_unity_build:
        description: 'Disable unity build'
        required: false
        default: 'false'

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.info.outputs.version }}
      DIST_EXE: ${{ steps.info.outputs.DIST_EXE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Debug version
        run: |
          export VERSION=$(git rev-parse --short HEAD)
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Release version
        if: github.event.inputs.release == 'true' && github.event.inputs.release != 'false' && !cancelled()
        run: |
          export VERSION="${{ github.event.inputs.version }}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Version
        id: info
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "DIST_EXE=wiliwili-Windows-${VERSION}" >> $GITHUB_OUTPUT

  build-win:
    needs: [ version ]
    runs-on: windows-2022
    strategy:
      matrix:
        include:
          - { arch: x86_64, msystem: MINGW64, driver: d3d, cmake: "-DUSE_D3D11=ON" }
    env:
      MSYSTEM: ${{ matrix.msystem }}
      MSYS2_PATH_TYPE: inherit
      SHELL_OPTS: "set -eo pipefail"
    defaults:
      run:
        shell: C:\shells\msys2bash.cmd -c "${{ env.SHELL_OPTS }}; $0" {0}

    steps:
      - name: Checkout code and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify submodules
        run: |
          if [ -n "$(git submodule status | grep -E '^-')" ]; then
            echo "::error::Some submodules are missing!"
            git submodule status
            exit 1
          fi

      - name: Check network connectivity
        run: |
          echo "=== Testing HTTPS/TLS ==="
          curl -v --retry 5 --retry-delay 3 https://github.com || { echo "::error::HTTPS to GitHub failed"; exit 1; }
          curl -v --retry 5 --retry-delay 3 https://api.github.com || { echo "::error::HTTPS to GitHub API failed"; exit 1; }

      - name: Setup MSYS2 with mirror
        run: |
          # 添加国内镜像加速
          echo "Server = https://mirrors.tuna.tsinghua.edu.cn/msys2/mingw/x86_64" >> /etc/pacman.d/mingw64.db
          echo "Server = https://mirrors.ustc.edu.cn/msys2/mingw/x86_64" >> /etc/pacman.d/mingw64.db
          
          echo "=== Updating MSYS2 ==="
          pacman -Syy --noconfirm  # 强制刷新包缓存
          pacman --noconfirm -Syuu --ignore=pacman || { echo "::error::First MSYS2 update failed"; exit 1; }
          pacman --noconfirm -Syuu --ignore=pacman || { echo "::error::Second MSYS2 update failed"; exit 1; }
          
          echo "=== Installing required packages (without libcrypt) ==="
          REQUIRED_PACKAGES=(
            ${MINGW_PACKAGE_PREFIX}-gcc
            ${MINGW_PACKAGE_PREFIX}-ninja
            ${MINGW_PACKAGE_PREFIX}-cmake
            ${MINGW_PACKAGE_PREFIX}-curl
            ${MINGW_PACKAGE_PREFIX}-toolchain
            ${MINGW_PACKAGE_PREFIX}-ntldd-git
            ${MINGW_PACKAGE_PREFIX}-openssl
            ${MINGW_PACKAGE_PREFIX}-ca-certificates
            unzip
          )
          
          for pkg in "${REQUIRED_PACKAGES[@]}"; do
            if ! pacman -Qi "${pkg}" &> /dev/null; then
              echo "Installing ${pkg}..."
              pacman --noconfirm -S --needed "${pkg}" || { echo "::error::Failed to install ${pkg}"; exit 1; }
            fi
          done
          
          # 验证 OpenSSL 安装
          echo "=== Verifying OpenSSL installation ==="
          if ! command -v openssl &> /dev/null; then
            echo "::error::openssl not found in PATH"
            exit 1
          fi
          openssl version -a

      - name: Download dependencies with retries
        run: |
          export CURL_OPTS="--retry 5 --retry-delay 3 --connect-timeout 30"
          
          echo "=== Downloading mpv package ==="
          MPV_URL="https://github.com/xfangfang/wiliwili/releases/download/v0.1.0/${MINGW_PACKAGE_PREFIX}-mpv-0.39.0-4-any.pkg.tar.zst"
          curl -LO ${CURL_OPTS} "${MPV_URL}" || { echo "::error::Failed to download mpv"; exit 1; }
          
          echo "=== Verifying mpv package ==="
          MPV_PKG="${MINGW_PACKAGE_PREFIX}-mpv-0.39.0-4-any.pkg.tar.zst"
          if [ ! -f "${MPV_PKG}" ]; then
            echo "::error::mpv package is missing"
            exit 1
          fi
          
          echo "=== Installing mpv ==="
          pacman -U --noconfirm "${MPV_PKG}" || { echo "::error::Failed to install mpv"; exit 1; }
          
          echo "=== Downloading cv2pdb ==="
          CV2PDB_URL="https://github.com/rainers/cv2pdb/releases/download/v0.52/cv2pdb-0.52.zip"
          curl -LO ${CURL_OPTS} "${CV2PDB_URL}" || { echo "::error::Failed to download cv2pdb"; exit 1; }
          
          echo "=== Installing cv2pdb ==="
          unzip -q cv2pdb-0.52.zip cv2pdb64.exe -d /usr/bin || { echo "::error::Failed to unzip cv2pdb"; exit 1; }

      - name: Patch tweeny CMakeLists
        run: |
          TWEENY_CMAKE="library/borealis/library/lib/extern/tweeny/CMakeLists.txt"
          if [ ! -f "${TWEENY_CMAKE}" ]; then
            echo "::error::tweeny CMakeLists.txt not found"
            exit 1
          fi
          sed -i 's/cmake_minimum_required(VERSION 2.8)/cmake_minimum_required(VERSION 3.5)/' "${TWEENY_CMAKE}"

      - name: Update gamepad database
        run: |
          BRLS_GLFW="library/borealis/library/lib/extern/glfw"
          cmake -P ${BRLS_GLFW}/CMake/GenerateMappings.cmake ${BRLS_GLFW}/src/mappings.h.in ${BRLS_GLFW}/src/mappings.h

      - name: CMake configuration
        run: |
          rm -rf build || true
          mkdir -p build
          
          cmake -B build -G Ninja ${{ matrix.cmake }} \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DPLATFORM_DESKTOP=ON \
            -DWIN32_TERMINAL=OFF \
            -DUSE_SYSTEM_CURL=ON \
            -DCPR_FORCE_OPENSSL_BACKEND=ON \
            -DCPR_USE_SYSTEM_CURL=ON \
            -DCURL_INCLUDE_DIR="${MINGW_PREFIX}/include" \
            -DCURL_LIBRARY="${MINGW_PREFIX}/lib/libcurl.a" \
            -DUSE_LIBROMFS=ON \
            -DBRLS_UNITY_BUILD="${{ github.event.inputs.disable_unity_build == 'true' && 'OFF' || 'ON' }}" \
            -DMPV_BUNDLE_DLL="${MINGW_PREFIX}/bin/libmpv-2.dll" \
            -DVERSION_BUILD="${{ github.run_number }}"
          
          if [ ! -f "build/build.ninja" ]; then
            echo "::error::CMake failed to generate build files"
            exit 1
          fi

      - name: Build
        run: |
          cmake --build build --verbose || { echo "::error::Build failed"; exit 1; }
          if [ ! -f "build/wiliwili.exe" ]; then
            echo "::error::Executable not generated"
            exit 1
          fi

      - name: Collect DLLs
        run: |
          mkdir -p dist
          cp build/wiliwili.exe dist/
          cp build/wiliwili.pdb dist/ 2>/dev/null || true
          
          CORE_DLLS=(
            libcurl-4.dll libcrypto-3-x64.dll libssl-3-x64.dll
            libmpv-2.dll libgcc_s_seh-1.dll libstdc++-6.dll libwinpthread-1.dll
          )
          
          for dll in "${CORE_DLLS[@]}"; do
            DLL_PATH="${MINGW_PREFIX}/bin/${dll}"
            [ -f "${DLL_PATH}" ] && cp "${DLL_PATH}" dist/ || { echo "::error::Missing ${dll}"; exit 1; }
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.version.outputs.DIST_EXE }}-${{ matrix.driver }}-${{ matrix.arch }}-full
          path: dist/*

  release:
    needs: [ build-win, version ]
    if: github.event.inputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      
      - name: Create release package
        run: |
          zip -r -9 ${{ needs.version.outputs.DIST_EXE }}.zip ${{ needs.version.outputs.DIST_EXE }}-*/*

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.event.inputs.version }}
          artifacts: ${{ needs.version.outputs.DIST_EXE }}.zip
          token: ${{ secrets.GITHUB_TOKEN }}
