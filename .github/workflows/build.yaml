name: wiliwili Windows Build (Auto + ZIP)

on:
  # 自动触发条件（与原始配置一致）
  push:
    branches: [ main, master ]
    paths:
      - '**.cpp'
      - '**.hpp'
      - '**.h'
      - 'CMakeLists.txt'
  pull_request:
    branches: [ main, master ]
  # 保留手动触发选项
  workflow_dispatch:
    inputs:
      release:
        description: 'Create release package'
        required: false
        default: 'true'
      version:
        description: 'Version tag'
        required: false
        default: 'nightly'

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set-version.outputs.version }}
      zip_name: ${{ steps.set-version.outputs.zip_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set version
        id: set-version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "version=${{ github.event.inputs.version || 'nightly' }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "version=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          fi
          echo "zip_name=wiliwili-${{ github.event.inputs.version || '$(git rev-parse --short HEAD)' }}-win64.zip" >> $GITHUB_OUTPUT

  build:
    needs: version
    runs-on: windows-2022
    env:
      MSYSTEM: MINGW64
      MSYS2_PATH_TYPE: inherit
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSYS2
        run: |
          choco install msys2 -y --params="/NoUpdate"
          refreshenv
          C:\tools\msys64\usr\bin\bash -lc "pacman -Syu --noconfirm"
          C:\tools\msys64\usr\bin\bash -lc "pacman -S --needed --noconfirm mingw-w64-x86_64-toolchain"

      - name: Install dependencies
        run: |
          C:\tools\msys64\usr\bin\bash -lc "
            pacman -S --noconfirm --needed \
              mingw-w64-x86_64-cmake \
              mingw-w64-x86_64-ninja \
              mingw-w64-x86_64-curl \
              mingw-w64-x86_64-openssl \
              mingw-w64-x86_64-ffmpeg \
              mingw-w64-x86_64-mpv
          "

      - name: Build
        run: |
          C:\tools\msys64\usr\bin\bash -lc "
            mkdir -p build && cd build
            cmake -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DOPENSSL_ROOT_DIR=${MINGW_PREFIX} \
              -DCURL_USE_OPENSSL=ON \
              ..
            ninja
          "

      - name: Package binaries
        shell: pwsh
        run: |
          # 创建临时目录
          $tempDir = "package_$([DateTime]::Now.Ticks)"
          New-Item -ItemType Directory -Path $tempDir | Out-Null
          
          # 复制文件
          Copy-Item build\wiliwili.exe $tempDir
          Get-ChildItem C:\tools\msys64\mingw64\bin\*.dll | Copy-Item -Destination $tempDir
          
          # 创建ZIP
          Compress-Archive -Path "$tempDir\*" -DestinationPath $env:GITHUB_WORKSPACE\${{ needs.version.outputs.zip_name }} -Force
          
          # 验证ZIP
          if (-not (Test-Path $env:GITHUB_WORKSPACE\${{ needs.version.outputs.zip_name }})) {
            Write-Error "Failed to create ZIP package"
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.version.outputs.zip_name }}
          path: ${{ needs.version.outputs.zip_name }}
          retention-days: 1

  release:
    needs: [build, version]
    if: ${{ github.event.inputs.release == 'true' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.version.outputs.zip_name }}

      - uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.version.outputs.version }}
          files: ${{ needs.version.outputs.zip_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
