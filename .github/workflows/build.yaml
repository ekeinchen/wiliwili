name: Build wiliwili (Windows 64-bit with all DLLs)

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: '发布新版本'
        required: false
        default: 'false'
      version:
        description: '版本号'
        required: false
        default: '0.0.0'
      disable_unity_build:
        description: '禁用联合构建'
        required: false
        default: 'false'

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.info.outputs.version }}
      DIST_EXE: ${{ steps.info.outputs.DIST_EXE }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 调试版本
        run: |
          export VERSION=$(git rev-parse --short HEAD)
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: 发布版本
        if: github.event.inputs.release == 'true' && github.event.inputs.release != 'false' && !cancelled()
        run: |
          export VERSION="${{ github.event.inputs.version }}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: 版本信息
        id: info
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "DIST_EXE=wiliwili-Windows-${VERSION}" >> $GITHUB_OUTPUT

  build-win:
    needs: [ version ]
    runs-on: windows-2022
    strategy:
      matrix:
        include:
          - { arch: x86_64, msystem: MINGW64, driver: d3d, cmake: "-DUSE_D3D11=ON" }
    env:
      MSYSTEM: ${{ matrix.msystem }}
      MSYS2_PATH_TYPE: inherit
      CHERE_INVOKING: 1  # 防止MSYS2修改工作目录
    defaults:
      run:
        shell: msys2 {0} -c  # 使用标准MSYS2 shell
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      
      - name: 设置MSYS2环境
        run: |
          # 更新基础系统
          pacman --noconfirm -Syuu --overwrite '*' --ignore=pacman,msys2-runtime
          pacman --noconfirm -Syu  # 二次更新确保完全升级
          
          # 安装必要工具链
          pacman --noconfirm -S --needed \
            ${MINGW_PACKAGE_PREFIX}-toolchain \
            ${MINGW_PACKAGE_PREFIX}-cmake \
            ${MINGW_PACKAGE_PREFIX}-ninja \
            ${MINGW_PACKAGE_PREFIX}-git \
            ${MINGW_PACKAGE_PREFIX}-curl \
            ${MINGW_PACKAGE_PREFIX}-openssl \
            ${MINGW_PACKAGE_PREFIX}-ca-certificates \
            unzip
      
      - name: 安装依赖项
        run: |
          # 安装mpv
          curl -L -o mpv.pkg.tar.zst https://github.com/xfangfang/wiliwili/releases/download/v0.1.0/${MINGW_PACKAGE_PREFIX}-mpv-0.39.0-4-any.pkg.tar.zst
          pacman --noconfirm -U mpv.pkg.tar.zst

          # 安装cv2pdb
          curl -L -o cv2pdb.zip https://github.com/rainers/cv2pdb/releases/download/v0.52/cv2pdb-0.52.zip
          unzip -j cv2pdb.zip cv2pdb64.exe -d /usr/bin
      
      - name: 修补tweeny CMakeLists
        run: |
          sed -i 's/cmake_minimum_required(VERSION 2.8)/cmake_minimum_required(VERSION 3.5)/' library/borealis/library/lib/extern/tweeny/CMakeLists.txt
      
      - name: 更新游戏手柄数据库
        run: |
          BRLS_GLFW=library/borealis/library/lib/extern/glfw
          cmake -P ${BRLS_GLFW}/CMake/GenerateMappings.cmake ${BRLS_GLFW}/src/mappings.h.in ${BRLS_GLFW}/src/mappings.h
      
      - name: 构建项目
        env:
          SSL_CERT_FILE: ${MINGW_PREFIX}/ssl/certs/ca-bundle.crt
          PATH: ${MINGW_PREFIX}/bin:$PATH
        run: |
          # 设置构建环境
          export CFLAGS="-O2 -pipe"
          export CXXFLAGS="-O2 -pipe"
          
          # 创建构建目录
          mkdir -p build && cd build
          
          # 配置CMake
          cmake .. -G Ninja ${{ matrix.cmake }} \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_INSTALL_PREFIX=${MINGW_PREFIX} \
            -DPLATFORM_DESKTOP=ON \
            -DWIN32_TERMINAL=OFF \
            -DUSE_SYSTEM_CURL=ON \
            -DCPR_FORCE_WINSSL_BACKEND=ON \
            -DUSE_LIBROMFS=ON \
            -DBRLS_UNITY_BUILD=${{ github.event.inputs.disable_unity_build == 'true' && 'OFF' || 'ON' }} \
            -DMPV_BUNDLE_DLL=${MINGW_PREFIX}/bin/libmpv-2.dll \
            -DVERSION_BUILD=${{ github.run_number }}
          
          # 执行构建
          cmake --build . --config RelWithDebInfo
          cv2pdb64 wiliwili.exe
          cp wiliwili.exe wiliwili.pdb ..
      
      - name: 收集运行时文件
        run: |
          mkdir -p dist
          cp build/wiliwili.exe build/wiliwili.pdb dist/
          cp README.md dist/

          # 复制证书文件
          mkdir -p dist/ssl/certs
          cp ${MINGW_PREFIX}/ssl/certs/ca-bundle.crt dist/ssl/certs/

          # 自动收集依赖的DLL
          for binary in dist/wiliwili.exe; do
            ntldd -R $binary | grep -i mingw | awk '{print $3}' | xargs -I{} cp {} dist/
          done

          # 确保关键DLL存在
          REQUIRED_DLLS=(
            libwinpthread-1.dll
            libgcc_s_seh-1.dll
            libstdc++-6.dll
            libmpv-2.dll
            libssl-3-x64.dll
            libcrypto-3-x64.dll
          )
          
          for dll in "${REQUIRED_DLLS[@]}"; do
            if [ ! -f "dist/${dll}" ]; then
              cp "${MINGW_PREFIX}/bin/${dll}" dist/
            fi
          done
      
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.version.outputs.DIST_EXE }}-${{ matrix.driver }}-${{ matrix.arch }}-full
          path: dist/*

  release:
    needs: [ build-win, version ]
    if: github.event.inputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      
      - name: 创建发布包
        run: |
          zip -r -9 ${{ needs.version.outputs.DIST_EXE }}-x86_64-full.zip ${{ needs.version.outputs.DIST_EXE }}-d3d-x86_64-full/*

      - name: 创建GitHub发布
        uses: ncipollo/release-action@v1
        with:
          name: wiliwili ${{ github.event.inputs.version }}
          tag: ${{ github.event.inputs.version }}
          body: Windows 64位构建版 wiliwili (包含所有必需DLL)
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: ${{ needs.version.outputs.DIST_EXE }}-x86_64-full.zip
