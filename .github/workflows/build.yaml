name: 构建 wiliwili (Windows 64位)

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: '发布新版本'
        required: false
        default: 'false'
      version:
        description: '版本号'
        required: false
        default: '0.0.0'

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.info.outputs.version }}
      DIST_EXE: ${{ steps.info.outputs.DIST_EXE }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 设置版本号
        id: info
        run: |
          if [[ "${{ github.event.inputs.release }}" == "true" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=$(git rev-parse --short HEAD)
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "DIST_EXE=wiliwili-Windows-${VERSION}" >> $GITHUB_OUTPUT

  build-win:
    needs: [ version ]
    runs-on: windows-2022
    defaults:
      run:
        shell: cmd /C "C:\msys64\msys2_shell.cmd -mingw64 -no-start -here -c '{0}'"
    steps:
      - name: 初始化MSYS2环境
        run: |
          # 更新MSYS2基础系统
          pacman --noconfirm -Syu
          pacman --noconfirm -Syuu
          
          # 安装必要工具链
          pacman --noconfirm -S --needed \
            mingw-w64-x86_64-toolchain \
            mingw-w64-x86_64-cmake \
            mingw-w64-x86_64-ninja \
            mingw-w64-x86_64-curl \
            mingw-w64-x86_64-openssl

      - name: 检出代码
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 构建准备
        run: |
          # 创建必要的目录
          mkdir -p build
          mkdir -p dist
          
          # 下载CA证书
          curl -L -o dist/cacert.pem https://curl.se/ca/cacert.pem

      - name: 配置和构建
        run: |
          cd build
          
          # 配置项目
          cmake .. -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DUSE_D3D11=ON \
            -DUSE_SYSTEM_CURL=ON \
            -DCPR_FORCE_OPENSSL_BACKEND=ON \
            -DOPENSSL_ROOT_DIR=/mingw64
          
          # 构建项目
          cmake --build . --parallel
          
          # 检查构建结果
          if [ ! -f "wiliwili.exe" ]; then
            echo "::error::构建失败 - 未生成可执行文件"
            ls -la
            exit 1
          fi
          
          # 复制可执行文件到dist目录
          cp wiliwili.exe ../dist/
          
          # 收集依赖
          ntldd -R wiliwili.exe | grep -i mingw64 | awk '{print $3}' | while read -r dll; do
            cp "$dll" ../dist/
          done

      - name: 验证制品
        run: |
          cd dist
          echo "=== dist目录内容 ==="
          ls -la
          
          # 检查关键文件
          REQUIRED_FILES=(
            "wiliwili.exe"
            "libgcc_s_seh-1.dll"
            "libstdc++-6.dll"
            "libwinpthread-1.dll"
          )
          
          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error::缺失关键文件: $file"
              exit 1
            fi
          done

      - name: 上传制品
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.version.outputs.DIST_EXE }}
          path: dist/*
          if-no-files-found: error
          retention-days: 5

  release:
    needs: [ build-win, version ]
    if: github.event.inputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.version.outputs.DIST_EXE }}
          
      - name: 创建发布包
        run: |
          mkdir -p release
          mv * release/
          cd release
          zip -r9 ../${{ needs.version.outputs.DIST_EXE }}.zip *
          
      - name: 发布版本
        uses: softprops/action-gh-release@v1
        with:
          name: v${{ github.event.inputs.version }}
          tag_name: v${{ github.event.inputs.version }}
          body: Windows 64位构建版本
          files: ${{ needs.version.outputs.DIST_EXE }}.zip
          draft: false
          prerelease: false
