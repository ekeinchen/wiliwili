name: Build wiliwili (Windows 64-bit with all DLLs)

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Push a new release'
        required: false
        default: 'false'
      version:
        description: 'Version'
        required: false
        default: '0.0.0'
      disable_unity_build:
        description: 'Disable unity build'
        required: false
        default: 'false'

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.info.outputs.version }}
      DIST_EXE: ${{ steps.info.outputs.DIST_EXE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Debug version
        run: |
          export VERSION=$(git rev-parse --short HEAD)
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Release version
        if: github.event.inputs.release == 'true' && github.event.inputs.release != 'false' && !cancelled()
        run: |
          export VERSION="${{ github.event.inputs.version }}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Version
        id: info
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "DIST_EXE=wiliwili-Windows-${VERSION}" >> $GITHUB_OUTPUT

  build-win:
    needs: [ version ]
    runs-on: windows-2022
    strategy:
      matrix:
        include:
          - { arch: x86_64, msystem: MINGW64, driver: d3d, cmake: "-DUSE_D3D11=ON" }
    env:
      MSYSTEM: ${{ matrix.msystem }}
      MSYS2_PATH_TYPE: inherit
    defaults:
      run:
        shell: C:\shells\msys2bash.cmd {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      
      - name: Setup MSYS2
        run: |
          pacman --noconfirm -Syuu --ignore=pacman
          pacman --noconfirm -S --needed --noprogressbar \
            ${MINGW_PACKAGE_PREFIX}-gcc \
            ${MINGW_PACKAGE_PREFIX}-ninja \
            ${MINGW_PACKAGE_PREFIX}-cmake \
            ${MINGW_PACKAGE_PREFIX}-toolchain \
            ${MINGW_PACKAGE_PREFIX}-ntldd-git \
            ${MINGW_PACKAGE_PREFIX}-openssl \
            ${MINGW_PACKAGE_PREFIX}-curl \
            unzip
      
      - name: Install dependencies
        run: |
          # 安装mpv
          curl -LO https://github.com/xfangfang/wiliwili/releases/download/v0.1.0/${MINGW_PACKAGE_PREFIX}-mpv-0.39.0-4-any.pkg.tar.zst
          pacman -U --noconfirm *.pkg.tar.zst

          # 安装cv2pdb
          curl -LO https://github.com/rainers/cv2pdb/releases/download/v0.52/cv2pdb-0.52.zip
          unzip cv2pdb-0.52.zip cv2pdb64.exe -d /usr/bin
      
      - name: Patch tweeny CMakeLists
        run: |
          sed -i 's/cmake_minimum_required(VERSION 2.8)/cmake_minimum_required(VERSION 3.5)/' library/borealis/library/lib/extern/tweeny/CMakeLists.txt
      
      - name: Update gamepad db
        run: |
          BRLS_GLFW=library/borealis/library/lib/extern/glfw
          cmake -P ${BRLS_GLFW}/CMake/GenerateMappings.cmake ${BRLS_GLFW}/src/mappings.h.in ${BRLS_GLFW}/src/mappings.h
      
      - name: Build
        run: |
          export CURL_INCLUDE_DIR=${MINGW_PREFIX}/include
          export CURL_LIBRARY=${MINGW_PREFIX}/lib/libcurl.a
          
          cmake -B build -G Ninja ${{ matrix.cmake }} \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DPLATFORM_DESKTOP=ON \
            -DWIN32_TERMINAL=OFF \
            -DUSE_SYSTEM_CURL=ON \
            -DCPR_USE_SYSTEM_CURL=ON \
            -DUSE_LIBROMFS=ON \
            -DBRLS_UNITY_BUILD=${{ github.event.inputs.disable_unity_build == 'true' && 'OFF' || 'ON' }} \
            -DCMAKE_UNITY_BUILD_BATCH_SIZE=20 \
            -DZLIB_USE_STATIC_LIBS=ON \
            -DMPV_BUNDLE_DLL=${MINGW_PREFIX}/bin/libmpv-2.dll \
            -DVERSION_BUILD=${{ github.run_number }} \
            -DCMAKE_POLICY_DEFAULT_CMP0048=NEW \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          
          cmake --build build
          cv2pdb64 build/wiliwili.exe
      
      - name: Collect all DLLs
        run: |
          mkdir -p dist
          cp build/wiliwili.exe dist/
          cp build/wiliwili.pdb dist/
          cp README.md dist/

          # 关键修改：完整的依赖DLL列表
          REQUIRED_DLLS=(
            libssl-3-x64.dll
            libcrypto-3-x64.dll
            libcurl-4.dll
            libbrotlidec.dll
            libbrotlicommon.dll
            libiconv-2.dll
            libidn2-0.dll
            libintl-8.dll
            libunistring-5.dll
            libnghttp2-14.dll
            libnghttp3-9.dll
            libngtcp2-16.dll
            libngtcp2_crypto_ossl.dll
            libpsl-5.dll
            libssh2-1.dll
            libzstd.dll
            zlib1.dll
            libmpv-2.dll
            libgcc_s_seh-1.dll
            libstdc++-6.dll
            libwinpthread-1.dll
          )

          for dll in "${REQUIRED_DLLS[@]}"; do
            if [ -f "${MINGW_PREFIX}/bin/${dll}" ]; then
              cp "${MINGW_PREFIX}/bin/${dll}" dist/
            else
              echo "::warning::Missing DLL: ${dll}"
            fi
          done

          # 新增CA证书
          curl -L -o dist/cacert.pem https://curl.se/ca/cacert.pem

          # 验证关键文件
          if ! [ -f "dist/libssl-3-x64.dll" ]; then
            echo "::error::libssl-3-x64.dll is missing!"
            exit 1
          fi
          if ! [ -f "dist/libcrypto-3-x64.dll" ]; then
            echo "::error::libcrypto-3-x64.dll is missing!"
            exit 1
          fi
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.version.outputs.DIST_EXE }}-${{ matrix.driver }}-${{ matrix.arch }}-full
          path: dist/*

  release:
    needs: [ build-win, version ]
    if: github.event.inputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      
      - name: Create release package
        run: |
          zip -r -9 ${{ needs.version.outputs.DIST_EXE }}-x86_64-full.zip ${{ needs.version.outputs.DIST_EXE }}-d3d-x86_64-full/*

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          name: wiliwili ${{ github.event.inputs.version }}
          tag: ${{ github.event.inputs.version }}
          omitBodyDuringUpdate: true
          body: Windows 64-bit build of wiliwili (with all required DLLs)
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: ${{ needs.version.outputs.DIST_EXE }}-x86_64-full.zip
