name: Build wiliwili (Windows 64-bit with all DLLs)

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Push a new release'
        required: false
        default: 'false'
      version:
        description: 'Version'
        required: false
        default: '0.0.0'
      disable_unity_build:
        description: 'Disable unity build'
        required: false
        default: 'false'

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.info.outputs.version }}
      DIST_EXE: ${{ steps.info.outputs.DIST_EXE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Debug version
        run: |
          export VERSION=$(git rev-parse --short HEAD)
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Release version
        if: github.event.inputs.release == 'true' && github.event.inputs.release != 'false' && !cancelled()
        run: |
          export VERSION="${{ github.event.inputs.version }}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Version
        id: info
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "DIST_EXE=wiliwili-Windows-${VERSION}" >> $GITHUB_OUTPUT

  build-win:
    needs: [ version ]
    runs-on: windows-2022
    strategy:
      matrix:
        include:
          - { arch: x86_64, msystem: MINGW64, driver: d3d, cmake: "-DUSE_D3D11=ON" }
    env:
      MSYSTEM: ${{ matrix.msystem }}
      MSYS2_PATH_TYPE: inherit
    defaults:
      run:
        shell: C:\shells\msys2bash.cmd {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      
      - name: Check network connectivity
        run: |
          echo "Testing network connections..."
          curl -v https://github.com
          curl -v https://api.github.com
          curl -v https://raw.githubusercontent.com
      
      - name: Setup MSYS2 with SSL dependencies
        run: |
          # 升级基础系统
          pacman --noconfirm -Syuu --ignore=pacman || true
          pacman --noconfirm -Syuu --ignore=pacman
          
          # 安装必要的包
          echo "Installing base packages..."
          pacman --noconfirm -S --needed --noprogressbar \
            ${MINGW_PACKAGE_PREFIX}-gcc \
            ${MINGW_PACKAGE_PREFIX}-ninja \
            ${MINGW_PACKAGE_PREFIX}-cmake \
            ${MINGW_PACKAGE_PREFIX}-curl \
            ${MINGW_PACKAGE_PREFIX}-toolchain \
            ${MINGW_PACKAGE_PREFIX}-ntldd-git \
            ${MINGW_PACKAGE_PREFIX}-openssl \
            ${MINGW_PACKAGE_PREFIX}-ca-certificates \
            ${MINGW_PACKAGE_PREFIX}-libcrypt \
            unzip
          
          # 验证安装结果
          echo "Installed OpenSSL version:"
          ${MINGW_PREFIX}/bin/openssl version
          
          # 更新证书信任库
          update-ca-trust
      
      - name: Install dependencies
        run: |
          # 安装mpv
          echo "Downloading mpv package..."
          curl -LO https://github.com/xfangfang/wiliwili/releases/download/v0.1.0/${MINGW_PACKAGE_PREFIX}-mpv-0.39.0-4-any.pkg.tar.zst
          
          # 验证下载完整性
          if [ ! -f "${MINGW_PACKAGE_PREFIX}-mpv-0.39.0-4-any.pkg.tar.zst" ]; then
            echo "::error::Failed to download mpv package"
            exit 1
          fi
          
          echo "Installing mpv..."
          pacman -U --noconfirm *.pkg.tar.zst
          
          # 安装cv2pdb
          echo "Downloading cv2pdb..."
          curl -LO https://github.com/rainers/cv2pdb/releases/download/v0.52/cv2pdb-0.52.zip
          
          # 验证下载完整性
          if [ ! -f "cv2pdb-0.52.zip" ]; then
            echo "::error::Failed to download cv2pdb"
            exit 1
          fi
          
          unzip cv2pdb-0.52.zip cv2pdb64.exe -d /usr/bin
      
      - name: Patch tweeny CMakeLists
        run: |
          sed -i 's/cmake_minimum_required(VERSION 2.8)/cmake_minimum_required(VERSION 3.5)/' library/borealis/library/lib/extern/tweeny/CMakeLists.txt
      
      - name: Update gamepad db
        run: |
          BRLS_GLFW=library/borealis/library/lib/extern/glfw
          cmake -P ${BRLS_GLFW}/CMake/GenerateMappings.cmake ${BRLS_GLFW}/src/mappings.h.in ${BRLS_GLFW}/src/mappings.h
      
      - name: Build with dynamic OpenSSL
        run: |
          export CURL_INCLUDE_DIR=${MINGW_PREFIX}/include
          export CURL_LIBRARY=${MINGW_PREFIX}/lib/libcurl.a
          
          # 动态链接 OpenSSL
          export OPENSSL_ROOT_DIR=${MINGW_PREFIX}
          
          cmake -B build -G Ninja ${{ matrix.cmake }} \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DPLATFORM_DESKTOP=ON \
            -DWIN32_TERMINAL=OFF \
            -DUSE_SYSTEM_CURL=ON \
            -DCPR_FORCE_OPENSSL_BACKEND=ON \
            -DCPR_USE_SYSTEM_CURL=ON \
            -DCURL_INCLUDE_DIR=${CURL_INCLUDE_DIR} \
            -DCURL_LIBRARY=${CURL_LIBRARY} \
            -DUSE_LIBROMFS=ON \
            -DBRLS_UNITY_BUILD=${{ github.event.inputs.disable_unity_build == 'true' && 'OFF' || 'ON' }} \
            -DCMAKE_UNITY_BUILD_BATCH_SIZE=20 \
            -DZLIB_USE_STATIC_LIBS=ON \
            -DMPV_BUNDLE_DLL=${MINGW_PREFIX}/bin/libmpv-2.dll \
            -DVERSION_BUILD=${{ github.run_number }} \
            -DCMAKE_POLICY_DEFAULT_CMP0048=NEW \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DOPENSSL_ROOT_DIR=${OPENSSL_ROOT_DIR}
          
          cmake --build build
          cv2pdb64 build/wiliwili.exe
      
      - name: Debug dependencies
        run: |
          echo "OpenSSL details:"
          openssl version -a
          which openssl
          
          echo "Dependency check for wiliwili.exe:"
          ntldd build/wiliwili.exe | grep -iE "ssl|crypto|curl"
      
      - name: Collect all files with SSL support
        run: |
          mkdir -p dist
          cp build/wiliwili.exe dist/
          cp build/wiliwili.pdb dist/
          cp README.md dist/

          # 核心依赖
          CORE_DLLS=(
            libcurl-4.dll libcrypto-3-x64.dll libssl-3-x64.dll
            libbrotlidec.dll libbrotlicommon.dll libiconv-2.dll
            libidn2-0.dll libintl-8.dll libunistring-5.dll
            libnghttp2-14.dll libnghttp3-9.dll libngtcp2-16.dll
            libngtcp2_crypto_ossl.dll libpsl-5.dll libssh2-1.dll
            libzstd.dll zlib1.dll libmpv-2.dll
            libgcc_s_seh-1.dll libstdc++-6.dll libwinpthread-1.dll
          )

          echo "Collecting required DLLs..."
          for dll in "${CORE_DLLS[@]}"; do
            DLL_PATH="${MINGW_PREFIX}/bin/${dll}"
            if [ -f "${DLL_PATH}" ]; then
              cp "${DLL_PATH}" dist/
              echo "Copied: ${dll}"
            else
              echo "::warning::DLL not found: ${dll}"
            fi
          done

          # 额外验证
          REQUIRED_DLLS=(libcurl-4.dll libssl-3-x64.dll libcrypto-3-x64.dll)
          for dll in "${REQUIRED_DLLS[@]}"; do
            if [ ! -f "dist/${dll}" ]; then
              echo "::error::Critical DLL missing: ${dll}"
              exit 1
            fi
          done

          # 复制 SSL 证书目录
          mkdir -p dist/etc
          cp -r ${MINGW_PREFIX}/etc/ssl dist/etc/
          
          # 输出最终 dist 目录内容
          echo "Contents of dist directory:"
          ls -la dist/
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.version.outputs.DIST_EXE }}-${{ matrix.driver }}-${{ matrix.arch }}-full
          path: dist/*

  release:
    needs: [ build-win, version ]
    if: github.event.inputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      
      - name: Create release package
        run: |
          zip -r -9 ${{ needs.version.outputs.DIST_EXE }}-x86_64-full.zip ${{ needs.version.outputs.DIST_EXE }}-d3d-x86_64-full/*

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          name: wiliwili ${{ github.event.inputs.version }}
          tag: ${{ github.event.inputs.version }}
          omitBodyDuringUpdate: true
          body: Windows 64-bit build of wiliwili (with TLS/SSL fixes)
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: ${{ needs.version.outputs.DIST_EXE }}-x86_64-full.zip
